name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted]
    concurrency:
      group: deploy-todo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EliteDesk
        run: bash scripts/deploy.sh

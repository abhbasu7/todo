<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Todo</title>
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<meta name="theme-color" content="#fffdf5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#fbf3d9; --panel:#fffdf5; --panel2:#faf0d0; --text:#2a2110; --muted:#7d6f4a; --border:#eadfbc; --head:#fffdf5; --head-text:#2a2110; --head-btn:#faf0d0; --head-btn-text:#2a2110; --head-btn-border:#eadfbc; --head-border:#eadfbc; --hover:#faf0d0; --focus:#b45309; --accent:#b45309; --accent-text:#ffffff; --danger-hover:#fee2e2; --danger-text:#b91c1c; --chip-today-bg:#fef3c7; --chip-today-text:#92400e; --chip-over-bg:#fee2e2; --chip-over-text:#991b1b; --drag-sub:#0f766e; }
  body.dark { --bg:#03061a; --panel:#121f45; --panel2:#0a1430; --text:#ecf0fb; --muted:#b0bedd; --border:#354b8f; --head:#121f45; --head-text:#ecf0fb; --head-btn:#243a70; --head-btn-text:#ecf0fb; --head-btn-border:#3d5ca3; --head-border:#354b8f; --hover:#1e3268; --focus:#60a5fa; --accent:#4f8ff7; --accent-text:#ffffff; --danger-hover:#450a0a; --danger-text:#f87171; --chip-today-bg:#572303; --chip-today-text:#fcd34d; --chip-over-bg:#450a0a; --chip-over-text:#fca5a5; --drag-sub:#2dd4bf; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; }
  header { padding:1rem; padding-top:calc(1rem + env(safe-area-inset-top)); background:var(--head); color:var(--head-text); border-bottom:1px solid var(--head-border); display:flex; justify-content:space-between; align-items:center; gap:.75rem; flex-wrap:wrap; }
  header h1 { font-size:1.125rem; }
  header .actions { display:flex; gap:.5rem; flex-wrap:wrap; }
  header button { background:var(--head-btn); color:var(--head-btn-text); border:1px solid var(--head-btn-border); height:2.25rem; padding:0 .75rem; border-radius:.5rem; cursor:pointer; font-size:.875rem; }
  .layout { display:flex; flex:1; min-height:0; }
  .panel { overflow-y:auto; padding:1rem; -webkit-overflow-scrolling:touch; }
  .left { width:44%; max-width:500px; border-right:1px solid var(--border); background:var(--panel); }
  .right { flex:1; background:var(--panel2); }
  #detailContent { max-width:46rem; margin-inline:auto; }
  .add-row { display:flex; gap:.5rem; margin-bottom:.5rem; }
  .add-row input, .edit-input { flex:1; height:2.75rem; padding:0 .75rem; border:1px solid var(--border); border-radius:.5rem; font-size:1rem; outline:none; background:var(--panel); color:var(--text); }
  .add-row button { height:2.75rem; padding:0 1rem; background:var(--accent); color:var(--accent-text); border:1px solid var(--border); border-radius:.5rem; cursor:pointer; font-weight:600; font-size:1rem; }
  .search { width:100%; height:2.75rem; padding:0 .75rem; border:1px solid var(--border); border-radius:.5rem; font-size:1rem; margin-bottom:.5rem; background:var(--panel); color:var(--text); }
  .row2 { display:flex; gap:.5rem; margin-bottom:.5rem; align-items:center; flex-wrap:wrap; }
  .filters { display:flex; gap:.5rem; }
  .filters button { height:2.5rem; padding:0 .75rem; border-radius:999px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; font-size:.875rem; }
  .filters button.active { background:var(--accent); color:var(--accent-text); }
  select { height:2.5rem; padding:0 .5rem; border-radius:.5rem; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:1rem; }
  .task { display:flex; align-items:center; gap:.5rem; padding:.5rem .75rem; border:0; border-bottom:1px solid var(--border); border-radius:0; margin-bottom:0; cursor:pointer; background:transparent; }
  .task.selected { background:var(--hover); box-shadow:inset 3px 0 0 var(--accent); }
  .task.done .title, .sub.done .title { text-decoration:line-through; color:var(--muted); }
  .title { flex:1; font-size:.875rem; word-break:break-word; }
  .meta { font-size:.6875rem; color:var(--muted); white-space:nowrap; }
  .badge { font-size:.6875rem; padding:.125rem .5rem; border-radius:999px; white-space:nowrap; }
  .due { background:var(--hover); color:var(--muted); } .due.today { background:var(--chip-today-bg); color:var(--chip-today-text); } .due.overdue { background:var(--chip-over-bg); color:var(--chip-over-text); }
  .prio { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .prio.high { background:#dc2626; } .prio.med { background:#f59e0b; } .prio.low { background:var(--muted); }
  .icon-btn { background:none; border:0; color:var(--muted); cursor:pointer; font-size:.875rem; min-width:2rem; min-height:2rem; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-btn.edit { transform:scaleX(-1); } .flip-x { display:inline-block; transform:scaleX(-1); }
  .icon-btn:hover { color:var(--text); } .icon-btn.del:hover { color:var(--danger-text); }
  .drag { cursor:grab; color:var(--muted); font-size:.875rem; flex-shrink:0; }
  .task.drag-over { border-top:3px solid var(--accent); }
  .sub.drag-over { border-top:3px solid var(--drag-sub); }
  input[type="checkbox"] { appearance:none; -webkit-appearance:none; width:20px; height:20px; margin:0; border:1.5px solid var(--muted); border-radius:50%; background:transparent; cursor:pointer; flex-shrink:0; display:inline-grid; place-content:center; }
  input[type="checkbox"]:checked { background:var(--accent); border-color:var(--accent); }
  input[type="checkbox"]:checked::after { content:""; width:11px; height:11px; background:var(--accent-text); clip-path:polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
  .empty { color:var(--muted); font-size:.875rem; padding:1.5rem .5rem; text-align:center; line-height:1.5; }
  .right h2 { font-size:1.125rem; word-break:break-word; cursor:text; }
  .hint { font-size:.6875rem; color:var(--muted); margin-top:.25rem; }
  .progress { height:8px; background:var(--border); border-radius:999px; overflow:hidden; margin:.75rem 0; }
  .progress > div { height:100%; background:var(--accent); transition:width .2s; }
  .fields { display:flex; gap:.75rem; flex-wrap:wrap; margin:.75rem 0; }
  .fields label { font-size:.75rem; color:var(--muted); display:flex; flex-direction:column; gap:.25rem; }
  .fields input, .fields select { height:2.5rem; padding:0 .75rem; border:1px solid var(--border); border-radius:.5rem; background:var(--panel); color:var(--text); font-size:1rem; }
  textarea { width:100%; min-height:4.5rem; padding:.75rem; border:1px solid var(--border); border-radius:.5rem; font-size:1rem; font-family:inherit; background:var(--panel); color:var(--text); resize:vertical; margin-bottom:.75rem; }
  .sub { display:flex; align-items:center; gap:.5rem; padding:.5rem .75rem; background:transparent; border:0; border-bottom:1px solid var(--border); border-radius:0; margin-bottom:0; }
  .danger { background:var(--danger-hover); border:1px solid transparent; color:var(--danger-text); padding:.75rem 1rem; border-radius:.5rem; cursor:pointer; font-size:.875rem; font-weight:600; }
  .ghost { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:.75rem 1rem; border-radius:.5rem; cursor:pointer; font-size:.875rem; font-weight:600; }
  .action-bar { position:sticky; bottom:-1rem; margin:1rem 0 -1rem; padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom)); background:var(--panel2); border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .back { display:none; margin-bottom:.75rem; background:none; border:0; cursor:pointer; font-size:1rem; color:var(--text); font-weight:600; }
  .install-tip { display:none; background:var(--chip-today-bg); color:var(--chip-today-text); padding:.75rem 1rem; font-size:.875rem; line-height:1.5; }
  /* Highlight the row when any of its controls has focus. */
  .task:focus-within, .sub:focus-within { background:var(--hover); outline:2px solid var(--focus); outline-offset:-2px; }
  button:focus-visible, input:focus, select:focus, textarea:focus { outline:2px solid var(--focus); outline-offset:2px; }
  .icon-btn:focus-visible { color:var(--text); background:var(--hover); border-radius:.25rem; }
  .icon-btn.del:focus-visible { color:var(--danger-text); background:var(--danger-hover); }
  @media (hover:hover) {
    .task:hover, .sub:hover { background:var(--hover); }
    button:hover { box-shadow:inset 0 0 0 999px rgb(100 116 139 / 20%); }
    .icon-btn:hover, .ghost:hover, .back:hover { background:var(--hover); }
    .danger:hover, .icon-btn.del:hover { background:var(--danger-hover); }
    input:not([type="checkbox"]):hover, select:hover, textarea:hover { border-color:var(--focus); }
  }
  @media (max-width:43.75em) {
    .layout { flex-direction:column; } .left,.right { width:100%; max-width:none; border-right:0; }
    .right { display:none; } body.show-detail .left { display:none; }
    body.show-detail .right { display:block; flex:1; } .back { display:block; }
  }
</style>
</head>
<body>
<div class="install-tip" id="installTip">📲 To install on iPhone: tap <b>Share</b> → <b>Add to Home Screen</b> → open it from the icon. It'll run full-screen and work offline.</div>
<header>
  <h1>✓ Todo <span style="font-size:11px;opacity:.6">v2</span></h1>
  <div class="actions">
    <button id="darkBtn">🌙 Dark</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button id="clearDoneBtn">Clear completed</button>
  </div>
</header>
<div class="layout">
  <section class="panel left">
    <div class="add-row">
      <input id="taskInput" placeholder="Add a task and press Enter…" maxlength="300">
      <button id="addTaskBtn">Add</button>
    </div>
    <input class="search" id="searchInput" placeholder="🔍 Search titles, notes, subtasks…">
    <div class="row2">
      <div class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="done">Done</button>
      </div>
      <select id="sortSel" title="Sort">
        <option value="manual">Sort: Manual</option>
        <option value="due">Sort: Due date</option>
        <option value="prio">Sort: Priority</option>
        <option value="new">Sort: Newest</option>
      </select>
    </div>
    <div id="taskList"></div>
    <div class="hint">Double-tap / double-click a title, or tap <span class="flip-x">✎</span>, to edit it. Drag ☰ to reorder.</div>
  </section>
  <section class="panel right" id="detailPanel">
    <button class="back" id="backBtn">← Back to tasks</button>
    <div id="detailContent"></div>
  </section>
</div>

<script>
const KEY='todo-v2', OLD_KEY='todo-v1';
let state=load(), selectedId=state.tasks[0]?.id||null, filter='all', query='', sortMode='manual';

function load(){
  try{
    let raw=localStorage.getItem(KEY);
    if(!raw){ const old=localStorage.getItem(OLD_KEY); if(old){ raw=old; } } // migrate v1
    if(raw){ const p=JSON.parse(raw); if(p&&Array.isArray(p.tasks)){ p.tasks.forEach(normalize); return p; } }
  }catch(e){}
  return {tasks:[], dark:false};
}
function normalize(t){ t.subtasks=t.subtasks||[]; t.notes=t.notes||''; t.due=t.due||''; t.priority=t.priority||'med'; t.subtasks.forEach(s=>{s.done=!!s.done}); }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function selected(){ return state.tasks.find(t=>t.id===selectedId)||null; }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function dueClass(t){ if(!t.due||t.done) return 'due'; if(t.due<todayStr()) return 'due overdue'; if(t.due===todayStr()) return 'due today'; return 'due'; }
function dueLabel(t){ if(t.due<todayStr()&&!t.done) return '⚠ '+t.due; if(t.due===todayStr()) return 'Today'; return t.due; }

// ---- Inline editing (tasks + subtasks + detail title) ----
function startEdit(span, current, onSave){
  if(span.parentElement.querySelector('.edit-input')) return;
  const input=document.createElement('input');
  input.className='edit-input'; input.value=current; input.maxLength=300;
  span.replaceWith(input); input.focus(); input.select();
  let done=false;
  const commit=(saveIt)=>{
    if(done) return; done=true;
    const v=input.value.trim();
    if(saveIt && v && v!==current) onSave(v);
    render();
  };
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter') commit(true);
    else if(e.key==='Escape') commit(false);
    e.stopPropagation();
  });
  input.addEventListener('blur',()=>commit(true));
  input.addEventListener('click',e=>e.stopPropagation());
  input.addEventListener('dblclick',e=>e.stopPropagation());
}

function addTask(title){
  title=(title||'').trim(); if(!title) return;
  const t={id:uid(),title,done:false,createdAt:Date.now(),subtasks:[],notes:'',due:'',priority:'med'};
  state.tasks.unshift(t); selectedId=t.id; save(); render();
}
function deleteTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(!confirm(`Delete "${t?.title}" and its ${t?.subtasks.length||0} subtasks?`)) return;
  state.tasks=state.tasks.filter(x=>x.id!==id);
  if(selectedId===id) selectedId=state.tasks[0]?.id||null;
  document.body.classList.remove('show-detail'); save(); render();
}

function render(){
  document.body.classList.toggle('dark', !!state.dark);
  document.getElementById('darkBtn').textContent = state.dark ? '☀️ Light' : '🌙 Dark';
  document.querySelector('meta[name="theme-color"]').content = state.dark ? '#121f45' : '#fffdf5';
  // Left
  const list=document.getElementById('taskList');
  let visible=state.tasks.filter(t=>
    (filter==='all'?true:filter==='active'?!t.done:t.done) &&
    (!query || t.title.toLowerCase().includes(query) || t.notes.toLowerCase().includes(query) || t.subtasks.some(s=>s.title.toLowerCase().includes(query)))
  );
  if(sortMode==='due') visible=[...visible].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  if(sortMode==='prio'){ const w={high:0,med:1,low:2}; visible=[...visible].sort((a,b)=>w[a.priority]-w[b.priority]); }
  if(sortMode==='new') visible=[...visible].sort((a,b)=>b.createdAt-a.createdAt);
  list.innerHTML=visible.length?'':`<div class="empty">${state.tasks.length?'Nothing matches.':'No tasks yet.<br>Add your first one above.'}</div>`;
  visible.forEach(t=>{
    const doneSubs=t.subtasks.filter(s=>s.done).length;
    const el=document.createElement('div');
    el.className='task'+(t.done?' done':'')+(t.id===selectedId?' selected':'');
    el.draggable = sortMode==='manual';
    el.innerHTML=`<span class="drag" title="Drag to reorder">☰</span>
      <input type="checkbox" ${t.done?'checked':''}>
      <span class="prio ${t.priority}" title="${t.priority} priority"></span>
      <span class="title">${esc(t.title)}</span>
      ${t.due?`<span class="badge ${dueClass(t)}">${dueLabel(t)}</span>`:''}
      ${t.subtasks.length?`<span class="meta">${doneSubs}/${t.subtasks.length}</span>`:''}
      <button class="icon-btn edit" title="Edit">✎</button>
      <button class="icon-btn del" title="Delete">×</button>`;
    const titleSpan=el.querySelector('.title');
    const doEdit=()=>startEdit(titleSpan, t.title, v=>{ t.title=v; save(); });
    el.querySelector('.edit').addEventListener('click',e=>{ e.stopPropagation(); doEdit(); });
    titleSpan.addEventListener('dblclick',e=>{ e.stopPropagation(); doEdit(); });
    el.querySelector('input').addEventListener('click',e=>e.stopPropagation());
    el.querySelector('input').addEventListener('change',e=>{ t.done=e.target.checked; save(); render(); });
    el.querySelector('.del').addEventListener('click',e=>{ e.stopPropagation(); deleteTask(t.id); });
    el.addEventListener('click',()=>{ selectedId=t.id; document.body.classList.add('show-detail'); render(); });
    // drag reorder (manual sort only)
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',t.id); });
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('drag-over');
      const fromId=e.dataTransfer.getData('text/plain');
      const from=state.tasks.findIndex(x=>x.id===fromId), to=state.tasks.findIndex(x=>x.id===t.id);
      if(from<0||to<0||from===to) return;
      const [moved]=state.tasks.splice(from,1); state.tasks.splice(to,0,moved); save(); render();
    });
    list.appendChild(el);
  });

  // Right
  const detail=document.getElementById('detailContent');
  const t=selected();
  if(!t){ detail.innerHTML=`<div class="empty">Select a task on the left<br>to see its subtasks here.</div>`; return; }
  const doneSubs=t.subtasks.filter(s=>s.done).length;
  const pct=t.subtasks.length?Math.round(doneSubs/t.subtasks.length*100):0;
  detail.innerHTML=`
    <h2 id="detailTitle" title="Double-click to edit">${esc(t.title)}</h2>
    <div class="hint">Double-click title to edit • ${t.subtasks.length?`${doneSubs} of ${t.subtasks.length} subtasks done (${pct}%)`:'No subtasks yet'}</div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="fields">
      <label>Due date <input type="date" id="dueInput" value="${t.due||''}"></label>
      <label>Priority <select id="prioSel">
        <option value="high" ${t.priority==='high'?'selected':''}>🔴 High</option>
        <option value="med" ${t.priority==='med'?'selected':''}>🟡 Medium</option>
        <option value="low" ${t.priority==='low'?'selected':''}>⚪ Low</option>
      </select></label>
    </div>
    <textarea id="notesInput" placeholder="Notes for this task… (saves automatically)">${esc(t.notes||'')}</textarea>
    <div class="add-row"><input id="subInput" placeholder="Add a subtask and press Enter…" maxlength="300"><button id="addSubBtn">Add</button></div>
    <div id="subList"></div>
    <div class="hint">Drag ☰ to reorder subtasks. Order saves automatically.</div>
    <div class="action-bar"><button class="danger" id="delTaskBtn">Delete task</button><button class="ghost" id="dupBtn">Duplicate</button></div>`;
  detail.querySelector('#detailTitle').addEventListener('dblclick',e=>{
    startEdit(e.target, t.title, v=>{ t.title=v; save(); });
  });
  detail.querySelector('#dueInput').addEventListener('change',e=>{ t.due=e.target.value; save(); render(); });
  detail.querySelector('#prioSel').addEventListener('change',e=>{ t.priority=e.target.value; save(); render(); });
  let noteTimer;
  detail.querySelector('#notesInput').addEventListener('input',e=>{ t.notes=e.target.value; clearTimeout(noteTimer); noteTimer=setTimeout(save,300); });
  const subList=detail.querySelector('#subList');
  let draggedSubId=null;
  const clearSubDrag=()=>{
    draggedSubId=null;
    subList.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  };
  if(!t.subtasks.length) subList.innerHTML=`<div class="empty">Break it down — add the first step above.</div>`;
  t.subtasks.forEach(s=>{
    const el=document.createElement('div');
    el.className='sub'+(s.done?' done':'');
    el.draggable=true;
    el.innerHTML=`<span class="drag" title="Drag to reorder subtask">☰</span><input type="checkbox" ${s.done?'checked':''}><span class="title">${esc(s.title)}</span><button class="icon-btn edit" title="Edit">✎</button><button class="icon-btn del">×</button>`;
    const span=el.querySelector('.title');
    const doEdit=()=>startEdit(span, s.title, v=>{ s.title=v; save(); });
    el.querySelector('.edit').addEventListener('click',doEdit);
    span.addEventListener('dblclick',doEdit);
    el.querySelector('input').addEventListener('change',e=>{ s.done=e.target.checked; save(); render(); });
    el.querySelector('.del').addEventListener('click',()=>{ t.subtasks=t.subtasks.filter(x=>x.id!==s.id); save(); render(); });
    // Keep subtask drags separate from task drags and text editing.
    el.addEventListener('dragstart',e=>{
      if(el.querySelector('.edit-input') || e.target.closest('input, button')){ e.preventDefault(); return; }
      draggedSubId=s.id;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('application/x-todo-subtask',s.id);
    });
    el.addEventListener('dragover',e=>{
      if(!draggedSubId || draggedSubId===s.id) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move'; el.classList.add('drag-over');
    });
    el.addEventListener('dragleave',e=>{
      if(!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    el.addEventListener('dragend',clearSubDrag);
    el.addEventListener('drop',e=>{
      e.preventDefault();
      const fromId=e.dataTransfer.getData('application/x-todo-subtask');
      const valid=draggedSubId && fromId===draggedSubId;
      clearSubDrag();
      if(!valid) return;
      const from=t.subtasks.findIndex(x=>x.id===fromId), to=t.subtasks.findIndex(x=>x.id===s.id);
      if(from<0 || to<0 || from===to) return;
      const [moved]=t.subtasks.splice(from,1); t.subtasks.splice(to,0,moved); save(); render();
    });
    subList.appendChild(el);
  });
  const input=detail.querySelector('#subInput');
  const addSub=()=>{ const v=input.value.trim(); if(!v) return; t.subtasks.push({id:uid(),title:v,done:false}); save(); render(); const n=document.querySelector('#subInput'); if(n) n.focus(); };
  detail.querySelector('#addSubBtn').addEventListener('click',addSub);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') addSub(); });
  detail.querySelector('#dupBtn').addEventListener('click',()=>{
    const copy=JSON.parse(JSON.stringify(t)); copy.id=uid(); copy.title=t.title+' (copy)'; copy.done=false;
    copy.subtasks.forEach(s=>{ s.id=uid(); s.done=false; });
    state.tasks.splice(state.tasks.findIndex(x=>x.id===t.id)+1,0,copy); selectedId=copy.id; save(); render();
  });
  detail.querySelector('#delTaskBtn').addEventListener('click',()=>deleteTask(t.id));
}

// Wiring
const taskInput=document.getElementById('taskInput');
const submitTask=()=>{ addTask(taskInput.value); taskInput.value=''; taskInput.focus(); };
document.getElementById('addTaskBtn').addEventListener('click',submitTask);
taskInput.addEventListener('keydown',e=>{ if(e.key==='Enter') submitTask(); });
document.getElementById('searchInput').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sortSel').addEventListener('change',e=>{ sortMode=e.target.value; render(); });
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.filter;
  document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b)); render();
}));
document.getElementById('backBtn').addEventListener('click',()=>document.body.classList.remove('show-detail'));
document.getElementById('darkBtn').addEventListener('click',()=>{ state.dark=!state.dark; save(); render(); });
document.getElementById('clearDoneBtn').addEventListener('click',()=>{
  if(!state.tasks.some(t=>t.done)) return;
  if(!confirm('Remove all completed tasks?')) return;
  state.tasks=state.tasks.filter(t=>!t.done);
  if(!selected()) selectedId=state.tasks[0]?.id||null; save(); render();
});
document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='todo-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(a.href);
});
const importFile=document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click',()=>importFile.click());
importFile.addEventListener('change',()=>{
  const f=importFile.files[0]; if(!f) return;
  f.text().then(txt=>{
    try{ const p=JSON.parse(txt); if(!p||!Array.isArray(p.tasks)) throw new Error('bad');
      if(!confirm(`Import ${p.tasks.length} tasks? This replaces your current list.`)) return;
      p.tasks.forEach(normalize); state=p; selectedId=state.tasks[0]?.id||null; save(); render();
    }catch(e){ alert('That file does not look like a todo backup.'); }
    importFile.value='';
  });
});

// iOS install tip: show only in a Safari tab, not when already installed
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true || window.matchMedia('(display-mode: standalone)').matches;
if(isIOS && !isStandalone) document.getElementById('installTip').style.display='block';

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
render();
</script>
</body>
</html>
